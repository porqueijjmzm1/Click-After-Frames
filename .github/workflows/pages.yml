name: Website

# Publishes docs/ (the Kosmos website) to GitHub Pages, with the settings list made fresh
# from mod.json.
on:
  push:
    branches: [ccr-b5c0153f-magtn3, main]
    paths: ["docs/**", "mod.json", "scripts/site_settings.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Settings list from mod.json
        run: python3 scripts/site_settings.py

      # turns Pages on the first time if it can; otherwise turn it on once in
      # Settings > Pages > Source: GitHub Actions
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
