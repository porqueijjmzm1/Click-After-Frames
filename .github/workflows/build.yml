name: Build Mod
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version to publish as a release (e.g. v3.0.0); leave empty for a test build'
        required: false
        default: ''
  push:
    branches: [main, ccr-b5c0153f-magtn3]
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
        - name: Android32
          os: ubuntu-latest
          target: Android32
        - name: Android64
          os: ubuntu-latest
          target: Android64
        - name: macOS
          os: macos-latest
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: stable
          combine: true
          target: ${{ matrix.config.target }}
  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
      # a release (run by hand with a version, or a v* tag) publishes InputBuffer.geode with
      # RELEASE_NOTES.md; any other build replaces TESTEBUFFER.geode on the "teste" pre-release
      - name: Publish the .geode
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.build.outputs.build-output }}
          RELEASE: ${{ inputs.release }}
        run: |
          file=$(find "$OUT" -name '*.geode' | head -n 1)
          test -n "$file"
          tag="$RELEASE"
          if [[ -z "$tag" && "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$tag" ]]; then
            cp "$file" InputBuffer.geode
            gh release create "$tag" InputBuffer.geode --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Input Buffer $tag" --notes-file RELEASE_NOTES.md --latest
          else
            cp "$file" TESTEBUFFER.geode
            gh release delete teste --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create teste TESTEBUFFER.geode --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "TESTEBUFFER" --notes "Build de teste do commit $GITHUB_SHA"
          fi
